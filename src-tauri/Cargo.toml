[package]
name = "codex-manager"
version = "1.2.0"
edition = "2021"

[lib]
name = "codex_manager"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
tauri-plugin-opener = "2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
similar = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
walkdir = "2.5"
reqwest = { version = "0.13.1", default-features = false, features = ["blocking", "json", "native-tls", "http2"] }
zip = "0.6"
urlencoding = "2.1.3"
dirs = "5"
rfd = "0.14"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3.10"
